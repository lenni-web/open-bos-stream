<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>DJI-Fernsteuerung · Open BOS Drohnen</title>
    <link rel="stylesheet" href="/static/css/obds.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/modern.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/theme.css?v={{ version }}">
    <link rel="stylesheet" href="/static/css/brand.css?v={{ version }}">
    <script src="/static/js/theme.js?v={{ version }}"></script>
</head>
<body class="auth-page">
    <main class="auth-card bos-card">
        <header class="auth-brand">
            <span class="auth-brand-icon" aria-hidden="true">
                <img src="/static/icons/open-bos-stream.svg?v={{ version }}" alt="" width="54" height="54">
            </span>
            <div>
                <strong>Open BOS Drohnen</strong>
                <span>Fernsteuerung verbinden</span>
            </div>
        </header>

        <form id="dji-login" class="auth-form" hidden>
            <label class="form-field">
                <span>Benutzername</span>
                <input id="dji-username" class="bos-input" autocomplete="username" required>
            </label>
            <label class="form-field">
                <span>Passwort</span>
                <input id="dji-password" class="bos-input" type="password" autocomplete="current-password" required>
            </label>
            <button class="bos-button bos-button-green" type="submit">Anmelden</button>
        </form>

        <p id="dji-status" class="dji-pilot-status" role="status">Wird geladen …</p>
        <button id="dji-retry" class="bos-button" type="button" hidden>Erneut verbinden</button>

        <details class="dji-pilot-log">
            <summary>Verbindungsprotokoll</summary>
            <ol id="dji-log"></ol>
        </details>
    </main>
    <script src="/static/js/dji-pilot.js?v={{ version }}"></script>
</body>
</html>
