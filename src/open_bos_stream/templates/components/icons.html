{#
    Einheitliche Linien-Symbole (24er-Raster, 1,8 px Strich, currentColor).
    Eingebettet statt Schriftzeichen, damit sie auf allen Geräten gleich
    aussehen und keine externe Abhängigkeit nötig ist.
#}
{% macro icon(name, size=20) -%}
<svg class="ui-icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "home" %}
    <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
{%- elif name == "media" %}
    <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/>
{%- elif name == "map" %}
    <path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14"/><path d="M15 6v14"/>
{%- elif name == "settings" %}
    <path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h4"/><path d="M12 17h8"/><circle cx="10" cy="17" r="2"/>
{%- elif name == "system" %}
    <rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01"/><path d="M7 16.5h.01"/>
{%- elif name == "collapse" %}
    <rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/><path d="m15.5 10-2 2 2 2"/>
{%- elif name == "sun" %}
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.9 19.1 1.4-1.4"/><path d="m17.7 6.3 1.4-1.4"/>
{%- elif name == "moon" %}
    <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
{%- elif name == "auto" %}
    <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/>
{%- elif name == "logout" %}
    <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/>
{%- elif name == "chevron-down" %}
    <path d="m6 9 6 6 6-6"/>
{%- elif name == "activity" %}
    <path d="M3 12h4l3-8 4 16 3-8h4"/>
{%- elif name == "layers" %}
    <path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/>
{%- elif name == "camera" %}
    <path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>
{%- elif name == "storage" %}
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>
{%- elif name == "globe" %}
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18"/><path d="M12 3a14 14 0 0 0 0 18"/>
{%- elif name == "users" %}
    <circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6.5 6.5 0 0 1 3.5 6"/>
{%- elif name == "mail" %}
    <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>
{%- elif name == "weather" %}
    <path d="M7.5 18.5h9a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6 1.3 2.9 2.9 0 0 0 .2 5.7z"/><path d="M8 6.5V5"/><path d="m4.6 8.1-1-1"/><path d="M3.5 11.5H2"/><path d="M11.3 8.4a3.5 3.5 0 0 0-6.2 2.4"/>
{%- elif name == "install" %}
    <rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7v7"/><path d="m9 11.5 3 3 3-3"/><path d="M10.5 18.5h3"/>
{%- elif name == "share" %}
    <path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M8.5 10H6.5a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8A1.5 1.5 0 0 0 17.5 10h-2"/>
{%- elif name == "plus-square" %}
    <rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M12 8v8"/><path d="M8 12h8"/>
{%- elif name == "dots" %}
    <circle cx="12" cy="5.5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="18.5" r="1.3"/>
{%- elif name == "grid" %}
    <rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/>
{%- elif name == "video" %}
    <rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="m15.5 10.5 6-3.5v10l-6-3.5"/>
{%- elif name == "tree" %}
    <rect x="9" y="3" width="6" height="5" rx="1.2"/><rect x="3" y="16" width="6" height="5" rx="1.2"/><rect x="15" y="16" width="6" height="5" rx="1.2"/><path d="M12 8v4"/><path d="M6 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/>
{%- elif name == "checklist" %}
    <rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="m8 8.5 1.5 1.5L12 7.5"/><path d="M14 9h3"/><path d="m8 14.5 1.5 1.5 2.5-2.5"/><path d="M14 15h3"/>
{%- elif name == "user" %}
    <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- elif name == "drone" %}
    <circle cx="5.5" cy="5.5" r="3"/><circle cx="18.5" cy="5.5" r="3"/><circle cx="5.5" cy="18.5" r="3"/><circle cx="18.5" cy="18.5" r="3"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/><path d="m7.7 7.7 1.8 1.8"/><path d="m16.3 7.7-1.8 1.8"/><path d="m7.7 16.3 1.8-1.8"/><path d="m16.3 16.3-1.8-1.8"/>
{%- elif name == "siren" %}
    <path d="M7 18v-6a5 5 0 0 1 10 0v6"/><path d="M5 21h14"/><path d="M5 18h14"/><path d="M12 3V2"/><path d="m4.2 6.2-.7-.7"/><path d="m19.8 6.2.7-.7"/><path d="M12 10v4"/>
{%- elif name == "bell" %}
    <path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/>
{%- endif %}
</svg>
{%- endmacro %}
