<div class="bos-card">

    <div class="section-heading">
        <div>
            <span class="section-kicker">Vorschau</span>
            <h3 id="media-title">Medium auswählen</h3>
        </div>
    </div>

    <video
        id="media-video"
        controls
        preload="metadata">

    </video>

    <img
        id="media-image"
        alt="">

    <div
        id="media-placeholder"
        <span class="empty-state-icon" aria-hidden="true">▧</span>
        <strong>Keine Vorschau geöffnet</strong>
        <span>Wähle links eine Aufnahme oder einen Snapshot aus.</span>

    </div>

</div>
