<section
    id="multi-source-panel"
    class="bos-card multi-source-panel"
    hidden>
    {% if user.role == "superadmin" %}
    <div id="media-capture-bar" class="media-capture-bar" hidden>
        <div class="media-capture-selection">
            <span class="section-kicker">Medienquelle</span>
            <strong id="media-capture-source-name">Keine Quelle ausgewählt</strong>
        </div>
        <div class="media-capture-actions">
            <span id="media-recording-duration" class="media-recording-duration"></span>
            <button
                id="media-snapshot-button"
                class="bos-button bos-button-small"
                type="button"
                onclick="createSnapshot()">
                📸 Snapshot
            </button>
            <button
                id="media-recording-toggle"
                class="bos-button bos-button-small"
                type="button"
                onclick="toggleRecording()">
                ⏺ Aufnahme starten
            </button>
        </div>
    </div>
    {% endif %}
    <div class="multi-source-header">
        <div>
            <span class="section-kicker">Livequellen</span>
            <h2>Livebilder</h2>
        </div>
        <span id="multi-source-summary" class="video-stream-state">
            0 von 0 online
        </span>
    </div>
    <div id="multi-source-grid" class="multi-source-grid"></div>
    <section id="offline-source-section" class="offline-source-section" hidden>
        <h3>Offline-Quellen</h3>
        <div id="offline-source-grid" class="offline-source-grid"></div>
    </section>
</section>
