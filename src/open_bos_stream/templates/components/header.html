<header class="bos-header">

    <div class="header-left">

        <div class="header-brand">

            <span class="header-logo">
                🚒
            </span>

            <div>

                <div class="header-title">

                    Open BOS Stream

                </div>

            </div>

        </div>

    <div class="header-status">

		<div class="status-pill">

		    <span class="status-dot status-green"></span>

		    <span id="header-source">

		        Quelle

		    </span>

		</div>

			<div class="status-pill">

			    <span class="status-dot status-green"></span>

			    <span id="header-encoder">

			        Encoder

			    </span>

			</div>

			<div class="status-pill">

			    <span
			        class="status-dot"
			        id="mediamtx-dot">

			    </span>

			    <span id="header-streaming">

			        Streaming

			    </span>

			</div>
			
            <div
                class="status-pill"
                id="header-cpu">

                CPU —

            </div>

            <div
                class="status-pill"
                id="header-ram">

                RAM —

            </div>

            <div
                class="status-pill"
                id="header-temp">

                — °C

            </div>

        </div>

    </div>

    <div class="header-right">

        <div class="header-ready">

            <span class="status-dot status-green"></span>

            Einsatzbereit

        </div>

        <div
            id="clock"
            class="header-clock">

            00:00:00

        </div>

    </div>

</header>
