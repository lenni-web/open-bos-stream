name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausführen
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  frontend:
    name: Frontend-Prüfung
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript-Syntax und Formatierung prüfen
        run: ./scripts/check-frontend.sh

  scripts:
    name: Shell-Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Skripte prüfen
        run: |
          status=0
          for script in scripts/*.sh; do
            bash -n "$script" || status=1
          done
          for script in scripts/open-bos-reboot-helper scripts/open-bos-stream-log-helper; do
            sh -n "$script" || status=1
          done
          exit "$status"
