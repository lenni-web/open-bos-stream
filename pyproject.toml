[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-bos-stream"
description = "Open Source BOS Video Streaming Server"
requires-python = ">=3.13"
dynamic = ["version"]

dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "pyyaml",
    "psutil",
    "pillow",
    "requests",
    "sqlalchemy",
    "alembic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "open_bos_stream.version.VERSION"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_bos_stream = [
    "map/styles/*.json",
    "map/layers/*.geojson",
    "map/glyphs/*/*.pbf",
    "static/css/*.css",
    "static/js/*.js",
    "static/docs/*.pdf",
    "static/vendor/*.js",
    "static/vendor/*.css",
    "static/vendor/mediamtx/*.js",
    "static/vendor/maplibre/*.js",
    "static/vendor/maplibre/*.css",
    "static/vendor/maplibre/*.mjs",
    "static/vendor/maplibre/LICENSE.txt",
    "db/migrations/*.py",
    "db/migrations/script.py.mako",
    "db/migrations/versions/*.py",
    "templates/*.html",
    "templates/components/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
