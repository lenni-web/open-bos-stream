[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "open-bos-stream"
description = "Open Source BOS Video Streaming Server"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "pyyaml",
    "psutil",
    "pillow"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
