{# Übersicht: alle Quellen kompakt, ein Klick öffnet die Livebilder. #}
<section id="overview-sources" class="bos-card overview-sources" aria-labelledby="overview-sources-title">
    <div class="overview-sources-header">
        <div>
            <span class="section-kicker">Lage</span>
            <h2 id="overview-sources-title">Drohnen und Livebilder</h2>
        </div>
        <button class="overview-count" type="button" onclick="showPage('streams')">
            <strong id="overview-online-count">–</strong>
            <small>online</small>
        </button>
    </div>
    <ul id="overview-source-list" class="overview-source-list">
        <li class="overview-empty">Wird geladen …</li>
    </ul>
    <div class="overview-actions">
        <button class="bos-button bos-button-small" type="button" onclick="showPage('streams')">
            Livebilder öffnen
        </button>
    </div>
</section>
